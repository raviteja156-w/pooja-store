<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Pooja Store{% endblock %}</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Poppins', 'sans-serif'] },
        colors: {
          brand: {
            50: '#fff7ed', 100:'#ffedd5', 200:'#fed7aa', 300:'#fdba74',
            400:'#fb923c', 500:'#f97316', 600:'#ea580c', 700:'#c2410c',
            800:'#9a3412', 900:'#7c2d12'
          }
        },
        animation: {
          'bounce-slow': 'bounce 2s infinite',
          'pop': 'pop .25s ease-out',
          'wiggle': 'wiggle 0.6s ease-in-out',
        },
        keyframes: {
          pop: { '0%': { transform: 'scale(0.8)', opacity: 0 }, '100%': { transform: 'scale(1)', opacity: 1 } },
          wiggle: { '0%,100%': { transform: 'rotate(-3deg)' }, '50%': { transform: 'rotate(3deg)' } },
        }
      }
    }
  }
</script>
</head>
<body class="bg-gradient-to-br from-orange-50 via-white to-amber-50 min-h-screen font-sans text-slate-800">

<nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-orange-100 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-md animate-bounce-slow">
        <i data-lucide="store" class="text-white w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-lg font-extrabold text-brand-700 leading-tight">POOJA STORE</h1>
        <p class="text-[11px] text-slate-400 -mt-1">Billing &amp; Inventory</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="{{ url_for('billing_page') }}"
         class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold transition-all
                {{ 'bg-brand-600 text-white shadow-md' if active=='billing' else 'text-slate-600 hover:bg-orange-100' }}">
        <i data-lucide="receipt-text" class="w-4 h-4"></i> Billing
      </a>
      <a href="{{ url_for('items_page') }}"
         class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold transition-all
                {{ 'bg-brand-600 text-white shadow-md' if active=='items' else 'text-slate-600 hover:bg-orange-100' }}">
        <i data-lucide="package" class="w-4 h-4"></i> Items
      </a>
    </div>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-4 py-6">
  {% block content %}{% endblock %}
</main>

<script>lucide.createIcons();</script>
{% block scripts %}{% endblock %}
</body>
</html>
